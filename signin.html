<!doctype html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-KKJG6LRD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · Linkloom</title>
<meta name="description" content="Sign in to Linkloom as a creator or a brand.">
<link rel="preconnect" href="https://accounts.google.com">
<link rel="preload" as="script" href="https://accounts.google.com/gsi/client">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Figtree:wght@400;500;600;700&family=Mynerve&display=swap">
</head>
<body data-role="creator">
<div class="page">
  <section class="loom" aria-label="Linkloom">
    <div class="top">
      <a class="logo" href="index.html" aria-label="Linkloom home">
        <svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="9.5" cy="13" r="6.5" fill="none" stroke="#eb6273" stroke-width="3"/><circle cx="16.5" cy="13" r="6.5" fill="none" stroke="#8981ee" stroke-width="3"/></svg>
        <span>linkloom</span>
      </a>
    </div>
    <div class="stage" aria-hidden="true">
      <svg class="rings" id="rings" viewBox="0 0 560 400">
        <defs><clipPath id="weave"><circle id="weaveDot" cx="280" cy="123" r="26"/></clipPath></defs>
        <path class="thread" id="thread" d="M -40 330 C 120 300, 200 180, 280 200 S 470 120, 620 90"/>
        <g class="ring g-c" id="gC"><circle class="r-c" cx="210" cy="200" r="150"/></g>
        <g class="ring g-b" id="gB"><circle class="r-b" cx="350" cy="200" r="150"/></g>
        <!-- the weave: coral passes over violet at the top crossing (violet is over coral at the bottom) -->
        <g class="ring g-c" id="gCw" clip-path="url(#weave)"><circle class="r-c" cx="210" cy="200" r="150"/></g>
      </svg>
    </div>
    <div class="lede"></div>
    <p class="note" aria-hidden="true">pick your thread →</p>
  </section>

  <main class="panel">
    <div class="card"></div>
  </main>
</div>
<div class="curtain" id="curtain" aria-hidden="true"><p id="curtainT"></p></div>

<script type="module" src="/src/apps/signin/main.jsx"></script>
</body>
</html>
